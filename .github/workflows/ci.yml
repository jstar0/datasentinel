name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install locked dependencies
        run: uv sync --locked --dev
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check src tests
      - name: Check lockfile
        run: uv lock --check
      - name: Build package
        run: uv build
      - name: Run contract and drift benchmark smoke test
        run: uv run datasentinel benchmark --output-dir /tmp/datasentinel-ci-benchmark --seed 17
      - name: Run multi-seed smoke test
        run: uv run datasentinel sweep --output-dir /tmp/datasentinel-ci-sweep --seeds 17,29,41
